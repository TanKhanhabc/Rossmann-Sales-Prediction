services:
  backend:
    build: {context: ., dockerfile: backend/Dockerfile}
    ports: ["8000:8000"]
    restart: unless-stopped
    volumes:
      - ./models:/workspace/models:ro
      - ./results:/workspace/results:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=5).read()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
  frontend:
    build: {context: ., dockerfile: frontend/Dockerfile}
    ports: ["5173:80"]
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
